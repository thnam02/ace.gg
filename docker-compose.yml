services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valorant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valorant}
      POSTGRES_DB: ${POSTGRES_DB:-valorant_scout}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valorant} -d ${POSTGRES_DB:-valorant_scout}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-valorant}:${POSTGRES_PASSWORD:-valorant}@db:5432/${POSTGRES_DB:-valorant_scout}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      RATE_LIMIT_COMPARE_PER_MINUTE: ${RATE_LIMIT_COMPARE_PER_MINUTE:-60}
      VLRGGAPI_BASE_URL: ${VLRGGAPI_BASE_URL:-http://host.docker.internal:3002}
      VLR_CIRCUIT_URL: ${VLR_CIRCUIT_URL:-https://www.vlr.gg/vct}
      VCT_SYNC_SEASON_YEAR: ${VCT_SYNC_SEASON_YEAR:-2026}
      VCT_SYNC_CRON: ${VCT_SYNC_CRON:-0 3 * * *}
      VCT_SYNC_ENABLED: ${VCT_SYNC_ENABLED:-false}
      VCT_SYNC_TOKEN: ${VCT_SYNC_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  vct-sync:
    profiles: ["sync"]
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-valorant}:${POSTGRES_PASSWORD:-valorant}@db:5432/${POSTGRES_DB:-valorant_scout}
      VLRGGAPI_BASE_URL: ${VLRGGAPI_BASE_URL:-http://host.docker.internal:3002}
      VLR_CIRCUIT_URL: ${VLR_CIRCUIT_URL:-https://www.vlr.gg/vct}
      VCT_SYNC_SEASON_YEAR: ${VCT_SYNC_SEASON_YEAR:-2026}
      VCT_SYNC_CRON: ${VCT_SYNC_CRON:-0 3 * * *}
      VCT_SYNC_RAW_CACHE_DIR: ${VCT_SYNC_RAW_CACHE_DIR:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/scripts/run_vct_sync_cron.sh"]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
