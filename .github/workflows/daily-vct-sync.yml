name: Daily VCT sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /ops/vct-sync
        env:
          ACEGG_API_URL: ${{ secrets.ACEGG_API_URL }}
          VCT_SYNC_TOKEN: ${{ secrets.VCT_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ACEGG_API_URL:-}" ] || [ -z "${VCT_SYNC_TOKEN:-}" ]; then
            echo "Set repository secrets ACEGG_API_URL and VCT_SYNC_TOKEN"
            exit 1
          fi
          url="${ACEGG_API_URL%/}/ops/vct-sync"
          code="$(curl -sS -o /tmp/vct-sync-body.json -w "%{http_code}" -X POST "$url" \
            -H "X-Sync-Token: ${VCT_SYNC_TOKEN}" \
            -H "Accept: application/json")"
          echo "HTTP ${code}"
          cat /tmp/vct-sync-body.json || true
          echo
          if [ "$code" = "200" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          echo "Unexpected status ${code}"
          exit 1
